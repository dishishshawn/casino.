[project]
name = "casino"
version = "0.1.0"
description = "Claude-powered retail trading system: Earnings-Drift LLM Long-Short."
requires-python = ">=3.11"
authors = [{ name = "Casino" }]
readme = "README.md"
dependencies = [
    "alpaca-py>=0.43.4",
    "anthropic>=0.97.0",
    "backtrader>=1.9.78.123",
    "beautifulsoup4>=4.14.3",
    "datasets>=4.8.5",
    "discord-webhook>=1.4.1",
    "duckdb>=1.5.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.1.0",
    "plotly>=6.7.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.57.0",
    "torch>=2.11.0",
    "transformers>=5.8.0",
    "vectorbt>=1.0.0",
    "yfinance>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["casino"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", ".venv", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["vectorbt.*", "duckdb.*", "backtrader.*", "plotly.*", "yfinance.*", "datasets.*", "transformers.*", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# backtrader's Strategy uses `params` as a tuple-of-tuples descriptor that
# mypy cannot see through; we relax subclassing rules on bt_validate only.
module = ["casino.backtest.bt_validate"]
disallow_subclassing_any = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
# DataFrame iloc / pivot / itertuples produce union types mypy cannot follow
# even after explicit casts; relaxed here, runtime correctness covered by tests.
module = [
    "casino.backtest.sue_baseline",
    "casino.backtest.composite_baseline",
    "casino.backtest.finbert_baseline",
    "casino.backtest.tsmom_baseline",
    "casino.backtest.carry_baseline",
    "casino.signals.ts_momentum",
    "casino.signals.carry",
]
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false
disable_error_code = ["arg-type", "operator", "index", "return-value", "no-untyped-def", "call-overload", "attr-defined", "unreachable"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "release_gate: tests guarding LLM look-ahead bias (PRD §6.3) — must always pass",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ipykernel>=6.29",
    "responses>=0.25",
    "pytest-asyncio>=0.23",
    "types-beautifulsoup4>=4.12.0.20250516",
    "nbconvert>=7.17.1",
    "pandas-stubs>=3.0.0.260204",
]
